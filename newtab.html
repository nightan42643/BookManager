<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页 - 书签管理器</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="header">
    <div class="header-left">
      <h1 class="logo">
        <img src="icons/icon.svg" alt="Logo" class="logo-icon"> 
        <span data-i18n="title">书签管理器</span>
      </h1>
      <div class="time-greeting">
        <div id="currentTime" class="time">00:00</div>
        <div id="greeting" class="greeting" data-i18n-greeting>你好</div>
      </div>
    </div>
    
    <div class="header-center">
      <div class="search-container">
        <input 
          type="text" 
          id="searchInput" 
          data-i18n-placeholder="searchPlaceholder"
          placeholder="🔍 搜索书签..." 
          autocomplete="off"
        >
      </div>
    </div>
    
    <div class="header-right">
      <button id="undoBtn" class="btn btn-secondary" title="撤销" disabled style="opacity: 0.5;">
        ↩️ <span data-i18n="undo">撤销</span>
      </button>
      <button id="langToggle" class="btn btn-icon" title="切换语言">
        🌍 中文
      </button>
      <button id="settingsBtn" class="btn btn-icon" title="设置">
        ⚙️ <span data-i18n="settings">设置</span>
      </button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- 侧边栏 - 分组列表 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2 data-i18n="myGroups">我的分组</h2>
        <span id="groupCount" class="count">0</span>
      </div>
      <div id="groupsList" class="groups-list">
        <!-- 分组将动态加载到这里 -->
      </div>
      <div class="sidebar-resize-handle"></div>
    </aside>

    <!-- 书签展示区 -->
    <section class="bookmarks-area">
      <div class="bookmarks-header">
        <h2 id="currentGroupTitle">所有书签</h2>
        <div class="bookmarks-actions">
          <button id="healthCheckBtn" class="btn btn-secondary" title="检查书签健康度">
            🩺 <span data-i18n="healthCheck">健康检查</span>
          </button>
          <button id="addBookmarkBtn" class="btn btn-primary">
            ➕ <span data-i18n="addBookmark">添加书签</span>
          </button>
          <!-- 批量操作按钮组（有选中项时显示） -->
          <div id="batchActions" class="batch-actions" style="display: none;">
            <span id="selectedCount" class="selected-count"></span>
            <button id="selectAllBtn" class="btn btn-secondary">
              <span data-i18n="selectAll">全选</span>
            </button>
            <button id="deleteSelectedBtn" class="btn btn-danger">
              🗑️ <span data-i18n="deleteSelected">删除选中</span>
            </button>
            <button id="clearSelectionBtn" class="btn btn-secondary">
              ✕ <span data-i18n="clearSelection">清除选择</span>
            </button>
          </div>
        </div>
      </div>
      
      <div id="bookmarksGrid" class="bookmarks-grid">
        <!-- 书签卡片将动态加载到这里 -->
      </div>

      <!-- 空状态 -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon">📭</div>
        <h3 data-i18n="noBookmarks">还没有书签</h3>
        <p data-i18n="clickToAdd">点击“添加书签”开始创建你的第一个书签</p>
      </div>
    </section>
  </main>

  <!-- 添加/编辑书签模态框 -->
  <div id="bookmarkModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">添加书签</h3>
        <button class="modal-close" id="closeModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="bookmarkTitle" data-i18n="bookmarkTitle">标题</label>
          <input type="text" id="bookmarkTitle" data-i18n-placeholder="titlePlaceholder" placeholder="输入书签标题">
        </div>
        <div class="form-group">
          <label for="bookmarkUrl" data-i18n="bookmarkUrl">网址</label>
          <input type="url" id="bookmarkUrl" data-i18n-placeholder="urlPlaceholder" placeholder="https://example.com">
        </div>
        <div class="form-group">
          <label for="bookmarkGroup" data-i18n="bookmarkGroup">分组</label>
          <select id="bookmarkGroup" size="5">
          </select>
        </div>
        <div class="form-group" id="subfolderSelectGroup" style="display: none;">
          <label for="bookmarkSubfolder" data-i18n="bookmarkSubfolder">子文件夹</label>
          <select id="bookmarkSubfolder" size="6">
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelBtn" class="btn btn-secondary" data-i18n="cancel">取消</button>
        <button id="saveBookmarkBtn" class="btn btn-primary" data-i18n="save">保存</button>
      </div>
    </div>
  </div>

  <!-- 添加/编辑文件夹模态框 -->
  <div id="groupModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="groupModalTitle">创建文件夹</h3>
        <button class="modal-close" id="closeGroupModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="groupName" data-i18n="folderName">文件夹名称</label>
          <input type="text" id="groupName" data-i18n-placeholder="folderNamePlaceholder" placeholder="输入文件夹名称">
        </div>
        <div class="form-group" style="display: none;">
          <label for="groupIcon">图标</label>
          <div class="icon-picker">
            <input type="text" id="groupIcon" value="📁" maxlength="2">
            <div class="icon-suggestions">
              <button type="button" class="icon-btn">📁</button>
              <button type="button" class="icon-btn">💼</button>
              <button type="button" class="icon-btn">🎯</button>
              <button type="button" class="icon-btn">⭐</button>
              <button type="button" class="icon-btn">🎨</button>
              <button type="button" class="icon-btn">📱</button>
              <button type="button" class="icon-btn">💻</button>
              <button type="button" class="icon-btn">🎮</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelGroupBtn" class="btn btn-secondary" data-i18n="cancel">取消</button>
        <button id="saveGroupBtn" class="btn btn-primary" data-i18n="save">保存</button>
      </div>
    </div>
  </div>

  <!-- 设置模态框 -->
  <div id="settingsModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="settings">设置</h3>
        <button class="modal-close" id="closeSettingsModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h4 data-i18n="language">语言</h4>
          <div class="setting-item">
            <div class="setting-info">
              <span class="setting-title" data-i18n="languageTitle">界面语言</span>
              <span class="setting-description" data-i18n="languageDesc">选择你喜欢的语言</span>
            </div>
            <select id="languageSelect" class="setting-select">
              <option value="zh-CN">中文</option>
              <option value="en-US">English</option>
            </select>
          </div>
        </div>
        <div class="settings-section">
          <h4 data-i18n="developer">开发者选项</h4>
          <div class="setting-item">
            <label class="setting-label">
              <div class="setting-info">
                <span class="setting-title" data-i18n="debugMode">Debug 模式</span>
                <span class="setting-description" data-i18n="debugModeDesc">显示详细的调试日志信息</span>
              </div>
              <div class="toggle-switch">
                <input type="checkbox" id="debugModeToggle">
                <span class="toggle-slider"></span>
              </div>
            </label>
          </div>
        </div>
        <div class="settings-section">
          <h4 data-i18n="cacheManagement">缓存管理</h4>
          <div class="setting-item">
            <div class="setting-info">
              <span class="setting-title" data-i18n="faviconCache">Favicon 缓存</span>
              <span class="setting-description" id="cacheInfo" data-i18n="loading">加载中...</span>
            </div>
            <button class="btn btn-secondary btn-sm" id="clearCacheBtn" data-i18n="clearCache">清空缓存</button>
          </div>
        </div>
        <div class="settings-section">
          <h4 data-i18n="about">关于</h4>
          <div class="setting-item">
            <div class="setting-info">
              <span class="setting-title" data-i18n="version">版本信息</span>
              <span class="setting-description" data-i18n="versionInfo">书签管理器 v1.0.0</span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="closeSettingsBtn" class="btn btn-primary" data-i18n="close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 自定义确认对话框 -->
  <div id="customDialog" class="custom-dialog-overlay" style="display: none;">
    <div class="custom-dialog">
      <div class="custom-dialog-header">
        <h3 id="dialogTitle">提示</h3>
      </div>
      <div class="custom-dialog-body">
        <p id="dialogMessage"></p>
      </div>
      <div class="custom-dialog-footer">
        <button id="dialogCancelBtn" class="btn btn-secondary" style="display: none;">取消</button>
        <button id="dialogConfirmBtn" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 自定义输入对话框 -->
  <div id="promptDialog" class="custom-dialog-overlay" style="display: none;">
    <div class="custom-dialog">
      <div class="custom-dialog-header">
        <h3 id="promptTitle">请输入</h3>
      </div>
      <div class="custom-dialog-body">
        <input type="text" id="promptInput" class="form-input" placeholder="" autocomplete="off">
      </div>
      <div class="custom-dialog-footer">
        <button id="promptCancelBtn" class="btn btn-secondary">取消</button>
        <button id="promptConfirmBtn" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div id="contextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-item" data-action="createSubfolder">
      <span class="context-menu-icon">📁➕</span>
      <span class="context-menu-label" data-i18n="createSubfolder">创建子文件夹</span>
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" data-action="rename">
      <span class="context-menu-icon">✏️</span>
      <span class="context-menu-label" data-i18n="renameFolder">重命名</span>
    </div>
    <div class="context-menu-item" data-action="delete">
      <span class="context-menu-icon">🗑️</span>
      <span class="context-menu-label" data-i18n="deleteFolder">删除文件夹</span>
    </div>
  </div>

  <!-- 书签右键菜单 -->
  <div id="bookmarkContextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-item" data-action="openNewTab">
      <span class="context-menu-icon">🔗</span>
      <span class="context-menu-label" data-i18n="openInNewTab">在新标签页打开</span>
    </div>
    <div class="context-menu-item" data-action="copyUrl">
      <span class="context-menu-icon">📋</span>
      <span class="context-menu-label" data-i18n="copyUrl">复制链接</span>
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" data-action="editBookmark">
      <span class="context-menu-icon">✏️</span>
      <span class="context-menu-label" data-i18n="editBookmark">编辑书签</span>
    </div>
    <div class="context-menu-item" data-action="deleteBookmark">
      <span class="context-menu-icon">🗑️</span>
      <span class="context-menu-label" data-i18n="deleteBookmark">删除书签</span>
    </div>
  </div>

  <!-- Toast 提示容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="newtab.js"></script>
</body>
</html>
