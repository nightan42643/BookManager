<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主渐变：现代蓝紫色 -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <!-- 书签渐变 -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- 高光渐变 -->
    <radialGradient id="highlight" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    
    <!-- 阴影 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 内阴影效果 -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetBlur"/>
      <feBlend in="SourceGraphic" in2="offsetBlur" mode="normal"/>
    </filter>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect width="128" height="128" rx="28" fill="url(#mainGrad)"/>
  
  <!-- 背景高光 -->
  <rect width="128" height="128" rx="28" fill="url(#highlight)"/>
  
  <!-- 装饰性圆点 -->
  <circle cx="20" cy="20" r="3" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="108" cy="20" r="2" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="20" cy="108" r="2" fill="#FFFFFF" opacity="0.2"/>
  
  <!-- 书签主体 -->
  <g filter="url(#shadow)">
    <!-- 书签背景 -->
    <path d="M 34 24 C 34 19 38 15 43 15 L 85 15 C 90 15 94 19 94 24 L 94 106 L 64 88 L 34 106 Z" 
          fill="url(#bookmarkGrad)" opacity="0.98"/>
    
    <!-- 书签边框 -->
    <path d="M 34 24 C 34 19 38 15 43 15 L 85 15 C 90 15 94 19 94 24 L 94 106 L 64 88 L 34 106 Z" 
          fill="none" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- 装饰线条 -->
  <line x1="46" y1="36" x2="82" y2="36" 
        stroke="url(#mainGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="46" y1="50" x2="78" y2="50" 
        stroke="url(#mainGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="46" y1="64" x2="72" y2="64" 
        stroke="url(#mainGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
  
  <!-- 星星装饰 -->
  <g transform="translate(84, 28)">
    <!-- 星星背景圆 -->
    <circle cx="0" cy="0" r="8" fill="#FCD34D" opacity="0.9"/>
    <!-- 五角星 -->
    <path d="M 0,-6 L 1.5,-2 L 6,-2 L 2.5,1 L 4,5 L 0,2 L -4,5 L -2.5,1 L -6,-2 L -1.5,-2 Z" 
          fill="#FFFFFF" opacity="0.95"/>
  </g>
  
  <!-- 书签底部高光 -->
  <path d="M 34 88 L 34 106 L 64 88 L 94 106 L 94 88 Z" 
        fill="#FFFFFF" opacity="0.08"/>
</svg>
